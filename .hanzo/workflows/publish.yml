name: publish

# A node must install the sandbox boundary from a VERIFIED artifact: every
# binary ships beside its sha512, and universe's install.sh pins those digests,
# so a tampered or truncated download aborts instead of running an unverified
# boundary.
#
# Until this lane existed, the visor on each node was built by hand from a
# working tree — 102MB nobody could reproduce, attribute to a commit, or check.
#
# It runs on OUR self-hosted pools, not GitHub's machines, and publishes with
# the token every run is given, so there is no credential here that can rot.
#
# IT LIVES IN .hanzo/workflows FOR THAT REASON. Under .github/ it is a workflow
# only GitHub Actions would run, and this estate has no runners there: the lane
# sat at .github/workflows/publish.yml, tag visor-20260911.0 was pushed at a
# commit that already carried it, and no release was ever created. A workflow in
# the wrong directory does not fail — it waits, which reads exactly like a lane
# nobody triggered.
on:
  push:
    tags: ['visor-*']
  workflow_dispatch:
    inputs:
      tag:
        description: An existing visor-* tag to publish
        required: true

permissions:
  contents: write

jobs:
  binaries:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runs-on: linux-amd64
          # aarch64 is NOT here yet, and that is a measurement: the runner image
          # oci.hanzo.ai/hanzoai/git-runner:5 is a single manifest, so an arm64
          # node cannot start it — its pods StartError and the job then sits
          # queued forever, which looks like nothing happening. Add this arch
          # back in the same commit that publishes a multi-arch runner image.
          #
          #   - arch: aarch64
          #     runs-on: linux-arm64
    runs-on: ${{ matrix.runs-on }}
    env:
      TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      # ONE bazel invocation for both, so the shim and the runtime it execs are
      # always the same build. A shim paired with a runtime it was not built
      # against fails at container start, after admission.
      # bazel DIRECTLY, not `make copy`: the Makefile wraps bazel in a container
      # and pushes to an upstream registry, so it needs a docker socket our
      # runners do not have — it failed with `dial unix /var/run/docker.sock`
      # before building anything.
      #
      # bazelisk rather than a pinned bazel, because the repo states its own
      # version in .bazelversion and bazelisk is the one thing that reads it.
      #
      # Installed WITHOUT sudo, into a directory this job already owns. Runners
      # execute inside the visor sandbox, where setuid is not honoured — sudo
      # there fails with "nosuid", so any step that reaches for root fails
      # before it does anything.
      - name: Install bazelisk
        run: |
          set -eu
          mkdir -p "$HOME/.local/bin"
          # The RELEASE is pinned; no digest is asserted, because a checksum
          # nobody verified out-of-band is theatre. What this lane actually
          # proves is the binary it produces — the version gate below rejects
          # anything that does not report -visor.
          curl -fsSL -o "$HOME/.local/bin/bazel" \
            https://github.com/bazelbuild/bazelisk/releases/download/v1.25.0/bazelisk-linux-amd64
          chmod 0755 "$HOME/.local/bin/bazel"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/bazel" version

      - name: Build
        run: |
          set -eu
          bazel build //runsc:runsc //shim:containerd-shim-runsc-v1
          mkdir -p bin
          cp -L "$(find -L bazel-bin/runsc -type f -name runsc | head -1)" bin/runsc
          cp -L "$(find -L bazel-bin -type f -name containerd-shim-runsc-v1 | head -1)" bin/containerd-shim-runsc-v1

      # The runtime installs as `visor` — the name the containerd handler and the
      # RuntimeClass both use. Asking it for its version is the cheapest proof the
      # bytes are ours: a binary reporting -gvisor is upstream's.
      - name: Name the bytes and prove they are ours
        run: |
          set -eu
          cd bin
          mv runsc visor
          chmod 0755 visor containerd-shim-runsc-v1
          ./visor --version | tee version.txt
          grep -q -- '-visor' version.txt || { echo "FATAL: this binary reports no -visor, so it is not our build"; exit 1; }
          for f in visor containerd-shim-runsc-v1; do
            sha512sum "$f" | awk '{print $1}' > "$f-${{ matrix.arch }}.sha512"
            mv "$f" "$f-${{ matrix.arch }}"
          done
          ls -l

      - name: Publish to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "$TAG" --notes "Verified visor binaries, built on our own runners."
          cd bin
          gh release upload "$TAG" \
            "visor-${{ matrix.arch }}" "visor-${{ matrix.arch }}.sha512" \
            "containerd-shim-runsc-v1-${{ matrix.arch }}" "containerd-shim-runsc-v1-${{ matrix.arch }}.sha512" \
            --clobber
          echo "published $(ls | tr '\n' ' ')"
