name: publish

# A node must install the sandbox boundary from a VERIFIED artifact. Every
# binary here ships beside its sha512, and universe's install.sh pins those
# digests, so a tampered or truncated download aborts the install instead of
# running an unverified boundary.
#
# Until this lane existed, the visor on each node was built by hand from a
# working tree: 102MB nobody could reproduce, attribute to a commit, or check.
on:
  push:
    tags: ['visor-*']
  workflow_dispatch:
    inputs:
      tag:
        description: An existing visor-* tag to publish
        required: true

permissions:
  contents: write

jobs:
  binaries:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runs-on: hanzo-linux-amd64
          - arch: aarch64
            runs-on: hanzo-linux-arm64
    runs-on: ${{ matrix.runs-on }}
    env:
      TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      # ONE bazel invocation for both, so the shim and the runtime it execs are
      # always the same build. A shim paired with a different runtime than it
      # was built against fails at container start, after admission.
      - name: Build
        run: make copy TARGETS="//runsc:runsc //shim:containerd-shim-runsc-v1" DESTINATION=bin/

      # The runtime installs as `visor` — the name the containerd handler and
      # the RuntimeClass both use. Asking it for its version is the cheapest
      # proof the bytes are ours: the guest reports 4.19.0-visor, and a binary
      # reporting -gvisor is upstream's.
      - name: Name the bytes and prove they are ours
        run: |
          set -eu
          cd bin
          mv runsc visor
          chmod 0755 visor containerd-shim-runsc-v1
          ./visor --version | tee version.txt
          grep -q -- '-visor' version.txt || { echo "FATAL: this binary does not report -visor, so it is not our build"; exit 1; }
          for f in visor containerd-shim-runsc-v1; do
            sha512sum "$f" | awk '{print $1}' > "$f-${{ matrix.arch }}.sha512"
            mv "$f" "$f-${{ matrix.arch }}"
          done
          ls -l

      # Published to the forge, with the token the runner is already given —
      # so this lane needs no secret anyone has to set, and cannot rot into a
      # dead credential the way the cloud build lane did.
      #
      # curl rather than a third-party action: one less dependency in the path
      # that publishes a security boundary.
      - name: Publish to the release
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          api=${{ github.server_url }}/v1/repos/${{ github.repository }}
          auth="Authorization: token $TOKEN"
          id=$(curl -fsSL -H "$auth" "$api/releases/tags/$TAG" 2>/dev/null \
               | sed -n 's/.*"id":[[:space:]]*\([0-9]*\).*/\1/p' | head -1 || true)
          if [ -z "$id" ]; then
            id=$(curl -fsSL -X POST -H "$auth" -H 'Content-Type: application/json' \
                   "$api/releases" -d "{\"tag_name\":\"$TAG\",\"name\":\"$TAG\"}" \
                 | sed -n 's/.*"id":[[:space:]]*\([0-9]*\).*/\1/p' | head -1)
          fi
          [ -n "$id" ] || { echo "FATAL: no release id for $TAG"; exit 1; }
          cd bin
          for f in visor-${{ matrix.arch }} visor-${{ matrix.arch }}.sha512 \
                   containerd-shim-runsc-v1-${{ matrix.arch }} containerd-shim-runsc-v1-${{ matrix.arch }}.sha512; do
            # Replace rather than append: a second run of one tag must not leave
            # two assets of one name, because install.sh pins by name.
            old=$(curl -fsSL -H "$auth" "$api/releases/$id/assets" \
                  | tr '}' '\n' | grep -F "\"name\":\"$f\"" \
                  | sed -n 's/.*"id":[[:space:]]*\([0-9]*\).*/\1/p' | head -1 || true)
            [ -z "$old" ] || curl -fsS -X DELETE -H "$auth" "$api/releases/$id/assets/$old" || true
            curl -fsS -X POST -H "$auth" -F "attachment=@$f" \
              "$api/releases/$id/assets?name=$f" > /dev/null
            echo "published $f"
          done
